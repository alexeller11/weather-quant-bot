services:
  - type: web
    name: weather-quant-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TRADING_ENABLED
        value: "1"

      - key: PAPER_EXECUTION_REQUIRED
        value: "1"

      # Modo gratuito: o Postgres Free do Render expira. Com github, o bot
      # usa bankroll.json na branch GITHUB_BRANCH como persistencia principal.
      - key: PERSISTENCE_MODE
        value: "github"

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        sync: false

      - key: TELEGRAM_TOKEN
        sync: false

      - key: CHAT_ID
        sync: false

      - key: GITHUB_TOKEN
        sync: false

      - key: GITHUB_REPO
        sync: false

      # CRITICO: nao usar a branch de deploy. Estava em "main", e cada
      # backup do bankroll disparava auto-deploy, matando o processo no
      # meio do ciclo (6.479 commits automaticos em main entre 2026-05 e
      # 2026-08, contra 1 em data-backup).
      # ATENCAO: render.yaml so define o valor na PRIMEIRA sincronizacao.
      # Se o serviço já existe, é preciso corrigir tambem no painel do
      # Render — Environment > GITHUB_BRANCH.
      - key: GITHUB_BRANCH
        value: data-backup

      - key: GROQ_API_KEY
        sync: false

      - key: WEATHERAPI_KEY
        sync: false
